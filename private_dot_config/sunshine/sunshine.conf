capture = kms
encoder = vaapi
adapter_name = /dev/dri/renderD128

# Listen on private IPv4 interfaces so iOS can pair through the routed LAN address.
# UPnP remains disabled, so Sunshine is not published through the internet router.
address_family = ipv4
bind_address = 0.0.0.0
upnp = disabled
origin_web_ui_allowed = wan

# Constrain transient bitrate spikes on AMD hardware over a remote connection.
max_bitrate = 30000
vaapi_strict_rc_buffer = enabled
