capture = kms
encoder = vaapi
adapter_name = /dev/dri/renderD128

# Keep every Sunshine port private to this device's Tailscale interface.
address_family = ipv4
bind_address = 100.116.171.7
upnp = disabled
origin_web_ui_allowed = wan

# Constrain transient bitrate spikes on AMD hardware over a remote connection.
max_bitrate = 30000
vaapi_strict_rc_buffer = enabled
